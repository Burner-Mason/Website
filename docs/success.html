<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you — Burner Mason</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("bm_theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Burner&nbsp;Mason</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <button class="theme-toggle" id="theme-toggle" type="button"></button>
      </nav>
    </div>
  </header>

  <main class="result">
    <div class="inner" id="result-inner">
      <h1>Thank you.</h1>
      <p>Your order's in. We'll mix it, pour it, pack it by hand, and email you tracking as soon as it ships.</p>
      <p style="margin-top:28px;"><a class="btn" href="index.html">Back to the shop</a></p>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Redirect-based payment methods return here with a redirect_status param.
    // Only treat a non-failed payment as success.
    (function () {
      var status = new URLSearchParams(location.search).get("redirect_status");
      if (status === "failed") {
        document.getElementById("result-inner").innerHTML =
          '<h1>Payment didn’t go through.</h1>' +
          '<p>No charge was made. You can try again — your cart is still here.</p>' +
          '<p style="margin-top:28px;"><a class="btn" href="checkout.html">Return to checkout</a></p>';
        return; // keep the cart
      }
      // Success (in-place confirm or redirect_status=succeeded/processing) — clear cart.
      if (window.BMCart) BMCart.clear();
    })();
  </script>
</body>
</html>
