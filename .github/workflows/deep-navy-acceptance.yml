# Deep Navy acceptance workflow - content-version: 1
#
# This file is owned by the Deep Navy platform and ensured by content hash:
# hand edits are detected as drift and re-proposed through a pull request
# rather than overwritten in place. It runs the repository's Cucumber
# acceptance suite on pushes to the default branch and publishes one check
# run per business objective (deep-navy/objective-<uuid>). Tag scenarios
# with @objective-<uuid> to bind them to an objective.
name: Deep Navy acceptance

on: push

permissions:
  contents: read
  checks: write

jobs:
  acceptance:
    # Acceptance evidence only ever comes from the default branch; any other
    # push exits successfully without running anything.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect acceptance features
        id: features
        run: |
          if [ -d features ] && find features -type f -name '*.feature' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No features/**/*.feature files; nothing to run."
          fi
      - name: Run acceptance suite
        if: steps.features.outputs.present == 'true'
        # The platform convention, in order: an explicit npm script wins, a
        # Makefile acceptance target is next, and the bare Cucumber runner is
        # the fallback. Whichever path runs must leave cucumber-report.json
        # behind for the reporter step.
        run: |
          if [ -f package.json ] && grep -q '"deep-navy:acceptance"' package.json; then
            npm run --if-present deep-navy:acceptance
          elif [ -f Makefile ] && grep -Eq '^acceptance[[:space:]]*:' Makefile; then
            make acceptance
          else
            npx --yes @cucumber/cucumber --format json:cucumber-report.json
          fi
      - name: Publish objective check runs
        # Failing scenarios must still publish their objectives' failing
        # checks, so this runs after a failed suite too; only cancellation
        # publishes nothing.
        if: ${{ !cancelled() && steps.features.outputs.present == 'true' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('cucumber-report.json')) {
              core.setFailed('cucumber-report.json was not produced; the acceptance suite must write it (--format json:cucumber-report.json)');
              return;
            }
            const report = JSON.parse(fs.readFileSync('cucumber-report.json', 'utf8'));
            const objectiveTag = /^@objective-([0-9a-f-]{36})$/;
            const objectives = new Map();
            for (const feature of Array.isArray(report) ? report : []) {
              for (const scenario of feature.elements || []) {
                if (scenario.type && scenario.type !== 'scenario') continue;
                const statuses = (scenario.steps || []).map((step) => (step.result && step.result.status) || 'unknown');
                const failed = statuses.some((status) => status === 'failed' || status === 'errored');
                const passed = statuses.length > 0 && statuses.every((status) => status === 'passed');
                const seen = new Set();
                for (const tag of [].concat(feature.tags || [], scenario.tags || [])) {
                  const match = objectiveTag.exec(((tag && tag.name) || '').trim());
                  if (!match || seen.has(match[1])) continue;
                  seen.add(match[1]);
                  const counts = objectives.get(match[1]) || { passed: 0, failed: 0, other: 0 };
                  if (failed) counts.failed += 1;
                  else if (passed) counts.passed += 1;
                  else counts.other += 1;
                  objectives.set(match[1], counts);
                }
              }
            }
            if (objectives.size === 0) {
              core.info('No @objective-<uuid> tagged scenarios in cucumber-report.json; no objective checks published.');
              return;
            }
            for (const [objective, counts] of objectives) {
              const total = counts.passed + counts.failed + counts.other;
              const success = counts.failed === 0 && counts.other === 0 && counts.passed > 0;
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'deep-navy/objective-' + objective,
                head_sha: context.sha,
                status: 'completed',
                conclusion: success ? 'success' : 'failure',
                output: {
                  title: success ? 'Objective satisfied' : 'Objective not satisfied',
                  summary: counts.passed + ' passed, ' + counts.failed + ' failed, ' + counts.other + ' not run, of ' + total + ' tagged scenario(s) on this commit.',
                },
              });
              core.info('deep-navy/objective-' + objective + ': ' + (success ? 'success' : 'failure'));
            }
